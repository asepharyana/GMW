# Discord Gateway service - handles message capture, voice recording, and AI moderation
language: typescript

tasks:
  dev:
    command: tsx watch src/index.ts
    preset: server

  build:
    command: tsc
    options:
      runFromWorkspaceRoot: false
    inputs:
      - src
      - tsconfig.json
    outputs:
      - dist

  typecheck:
    command: tsc --noEmit
    options:
      runFromWorkspaceRoot: false
    inputs:
      - src
      - tsconfig.json

  lint:
    command: biome check --diagnostic-level=error .
    options:
      runFromWorkspaceRoot: false
    inputs:
      - src

  format:
    command: biome format --write .
    options:
      runFromWorkspaceRoot: false
    inputs:
      - src

  test:
    command: vitest run
    options:
      runFromWorkspaceRoot: false
    inputs:
      - src
      - tests
      - tsconfig.json
