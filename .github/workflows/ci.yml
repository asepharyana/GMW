name: CI

# Runs the same checks as deploy.yml's `test` job, on every PR and on pushes
# that are not to main.
#
# WHY THIS EXISTS: deploy.yml triggers on push-to-main and deploys straight to
# the VPS. Until this file existed there was NO PR-triggered CI at all, so a
# broken push to main was discovered by production rather than by a check.
# deploy.yml stays the deploy path; this is the gate in front of it.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # 11 of the 29 backend test files are real-Postgres integration tests and 10
    # of those TRUNCATE shared tables, so the suite needs a live database. The
    # port here is deliberately NOT 6432: tests/setup-env.ts points DATABASE_URL
    # at a dead port on purpose so a unit test that accidentally opens a pool
    # fails loudly. Only the files that explicitly want a pool opt in.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gmw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gmw_test
      # A DB-backed test file that cannot build its isolated schema FAILS the run
      # rather than skipping. Without this, a missing schema silently skips every
      # assertion in those files and the suite still reports green — measured at
      # 21 files skipping against an empty database.
      GMW_REQUIRE_TEST_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply schema to the test database
        # `0000_baseline.sql` IS the schema of record: one migration, the whole
        # schema, verified to apply to an empty database (14 tables, 2 functions
        # including `claim_messages`, which the worker's queue depends on).
        #
        # `psql -f` rather than `pnpm db:migrate` on purpose. The drizzle migrator
        # loads `src/infrastructure/config`, whose zod schema validates
        # DISCORD_TOKEN / AI_LLM_API_KEY and friends at import time — running it
        # from CI means stubbing application config just to create tables. This
        # step needs no application config and no build step.
        #
        # This also unblocks the note that used to sit under GMW_REQUIRE_TEST_DB
        # above, which claimed the schema could not be applied safely because the
        # drizzle baseline snapshot is missing. That blocker was about the DRIFT
        # GATE (drizzle-kit's `generate` needs a snapshot to diff against), not
        # about applying SQL that already exists. `db-check` below still exits 2
        # for that reason; the tests here no longer depend on it.
        #
        # Driven by the journal, NOT by naming `0000_baseline.sql`. The old
        # hard-coded filename silently applied the FIRST migration only, so a
        # later one (0002) was present on disk but never ran here — the tests
        # then exercised a schema the code no longer expects and failed on the
        # difference, which is CI doing its job but blaming the wrong thing.
        # Reading `meta/_journal.json` is also what the real migrator does at
        # boot, so this cannot drift from it again: adding a migration means
        # adding a journal entry (see `drizzle-kit generate --custom`).
        run: |
          for tag in $(jq -r '.entries | sort_by(.when) | .[] | .tag' apps/backend/drizzle/migrations/meta/_journal.json); do
            echo "applying $tag"
            psql -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL" -f "apps/backend/drizzle/migrations/$tag.sql"
          done

      # Every gate below goes through `pnpm run`, never a bare `moon`.
      #
      # A raw `moon` is not on PATH in the runner's bash: only `pnpm run` and
      # `pnpm exec` prepend node_modules/.bin, so `moon run :typecheck` died with
      # `line 1: moon: command not found` and exit 127. Routing through the root
      # package.json also keeps CI and the local verify line as the same string
      # (`pnpm run test; pnpm run lint; pnpm run typecheck; pnpm run build; ...`),
      # so the two cannot drift apart.
      - name: Typecheck + lint + test
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test

      - name: Build
        run: pnpm run build

      - name: Design lint (frontend only)
        run: pnpm run lint:design

      # Migration drift gate.
      #
      # Blocking. What it enforces is the invariant that actually matters and is
      # actually checkable: `schema.ts` and `drizzle/migrations/` must change
      # together. It needs no baseline snapshot for that half.
      #
      # It used to be `continue-on-error: true` because the script exited 2 on
      # every run. That exit came from a snapshot guard that ran BEFORE the
      # real check and short-circuited it, so the step was red-by-design AND
      # enforced nothing. The script now runs the enforceable guard first and
      # only warns about the snapshot.
      #
      # The snapshot gap is still real and still worth knowing:
      # `drizzle/migrations/meta/0000_snapshot.json` does not exist, because the
      # baseline was captured with `pg_dump --schema-only` rather than generated
      # by drizzle-kit. Without it, `drizzle-kit generate` would emit a
      # migration re-CREATing every table (verified 2026-10-05:
      # `0001_heavy_molly_hayes.sql`, 325 lines of CREATE TABLE). So do NOT run
      # `pnpm db:generate` until the snapshot exists; the header of
      # `apps/backend/scripts/check-migration-drift.sh` carries the fix path
      # (port the 6 CHECK constraints, then regenerate). The 2 SQL functions
      # cannot be expressed in Drizzle's schema DSL and must be preserved by
      # hand in any generated migration.
      - name: Migration drift check
        # `pnpm exec` rather than bare `moon` for the same PATH reason as above.
        run: pnpm exec moon run backend:db-check
