version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["dependencies"]
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/services/backend"
    schedule:
      interval: "daily"
    labels: ["dependencies"]
    groups:
      production:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/services/discord-gateway"
    schedule:
      interval: "daily"
    labels: ["dependencies"]
    groups:
      production:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "daily"
    labels: ["dependencies"]
    groups:
      production:
        dependency-type: "production"
